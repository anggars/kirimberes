name: Deploy to cPanel (Rumahweb)

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile --config.node-linker=hoisted

    - name: Generate Prisma Client
      run: pnpm exec prisma generate

    - name: Build Project (Standalone)
      run: pnpm run build
      env:
        NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

    - name: Prepare Files for FTP
      run: |
        mkdir -p .deploy
        cp -a .next/standalone/. .deploy/
        mkdir -p .deploy/.next/static
        cp -a .next/static/. .deploy/.next/static/
        mkdir -p .deploy/public
        if [ -d "public" ]; then cp -a public/. .deploy/public/; fi

    - name: Patch server.js for cPanel Passenger
      run: |
        sed -i 's/parseInt(process.env.PORT, 10) || 3000/process.env.PORT || 3000/g' .deploy/server.js
        rm -f .gitignore

    - name: Deploy to FTP (cPanel)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: .deploy/
        server-dir: ${{ secrets.FTP_SERVER_DIR }}
        exclude: |
          **/.git*
          **/.git*/**
          **/.github*/**
          **/.github*
